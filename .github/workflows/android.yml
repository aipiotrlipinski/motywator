name: Zbuduj APK

# Każda zmiana w aplikacji na gałęzi main buduje nową APK i wystawia ją w zakładce Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Skopiuj stronę do aplikacji
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest favicon.ico icon-*.png android/app/src/main/assets/www/

      - name: Zbuduj
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Przygotuj plik
        run: cp android/app/build/outputs/apk/release/app-release.apk motywator.apk

      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Motywator 1.${{ github.run_number }}
          body: Zainstaluj plik motywator.apk na telefonie. Nowa wersja instaluje się na starą — dane zostają.
          files: motywator.apk
          make_latest: true
